apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: cake-delight

spec:
  replicas: 1

  selector:
    matchLabels:
      app: rabbitmq

  template:
    metadata:
      labels:
        app: rabbitmq

    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management

          ports:
            - containerPort: 5672
              name: amqp

            - containerPort: 15672
              name: management

          envFrom:
            - secretRef:
                name: rabbitmq-secret

          volumeMounts:
            - name: rabbitmq-storage
              mountPath: /var/lib/rabbitmq

          # Wait for RabbitMQ to actually accept AMQP connections.
          startupProbe:
            tcpSocket:
              port: 5672
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          # Pod is ready when AMQP port is available.
          readinessProbe:
            tcpSocket:
              port: 5672
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Restart only if AMQP becomes unavailable for a sustained period.
          livenessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"

            limits:
              memory: "512Mi"
              cpu: "500m"

      volumes:
        - name: rabbitmq-storage
          persistentVolumeClaim:
            claimName: rabbitmq-storage